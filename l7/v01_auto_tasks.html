<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Sistema Automático — Panel BRAIN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --card: #12121a;
    --border: #1e1e2e;
    --text: #e0e0e8;
    --muted: #6b6b80;
    --green: #00d68f;
    --green-bg: rgba(0,214,143,.12);
    --red: #ff4757;
    --red-bg: rgba(255,71,87,.12);
    --yellow: #ffa502;
    --yellow-bg: rgba(255,165,2,.12);
    --blue: #5b9bd5;
    --blue-bg: rgba(91,155,213,.12);
    --purple: #a55eea;
    --pink: #ff6b81;
    --cyan: #1dd1a1;
    --orange: #ff6348;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family:'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.5rem 2rem;
    position: sticky;
    top:0;
    z-index: 100;
    backdrop-filter: blur(20px);
  }

  .header-top {
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width: 1400px;
    margin:0 auto;
    flex-wrap:wrap;
    gap:1rem;
  }

  .logo { display:flex; align-items:center; gap:.75rem; }
  .logo .brain { font-size:2rem; }
  .logo h1 { font-size:1.5rem; font-weight:800; letter-spacing:-.5px; }
  .logo .sub { color: var(--muted); font-size:.85rem; font-weight:400; margin-left:.5rem; }

  .stats-row {
    display:flex;
    gap:1.5rem;
    align-items:center;
    flex-wrap:wrap;
  }

  .stat-pill {
    display:flex;
    align-items:center;
    gap:.4rem;
    padding:.4rem 1rem;
    border-radius: 2rem;
    font-size:.85rem;
    font-weight:600;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .stat-pill .dot { width:10px; height:10px; border-radius:50%; }
  .stat-pill.green .dot { background:var(--green); box-shadow:0 0 8px var(--green); }
  .stat-pill.red .dot { background:var(--red); box-shadow:0 0 8px var(--red); }
  .stat-pill.yellow .dot { background:var(--yellow); box-shadow:0 0 8px var(--yellow); }
  .stat-pill.gray .dot { background:var(--muted); }

  .last-check {
    font-size:.75rem;
    color: var(--muted);
    font-family:'JetBrains Mono', monospace;
  }

  /* Main layout */
  .main-grid {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap:1.25rem;
    padding:1.5rem 2rem;
    max-width: 1400px;
    margin:0 auto;
  }

  /* Agent card */
  .agent-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all .2s;
  }

  .agent-card:hover { border-color: #2a2a40; transform: translateY(-1px); }

  .agent-header {
    padding: 1.25rem 1.5rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .agent-header .left { display:flex; align-items:center; gap:.75rem; }
  .agent-emoji { font-size:1.75rem; }
  .agent-name { font-weight:700; font-size:1.1rem; }
  .agent-role { font-size:.75rem; color:var(--muted); display:block; }
  .agent-stats { display:flex; gap:.5rem; font-size:.75rem; font-weight:600; }

  .badge {
    padding:.2rem .7rem;
    border-radius: 1rem;
    font-size:.72rem;
    font-weight:600;
  }
  .badge.ok { background:var(--green-bg); color:var(--green); }
  .badge.err { background:var(--red-bg); color:var(--red); }
  .badge.warn { background:var(--yellow-bg); color:var(--yellow); }
  .badge.info { background:var(--blue-bg); color:var(--blue); }

  /* Task list */
  .task-list { padding:.75rem 1.5rem; }

  .task-group-title {
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--muted);
    padding:.75rem 0 .5rem;
    border-bottom:1px solid #1a1a2a;
    margin-bottom:.5rem;
  }

  .task-row {
    display:flex;
    align-items:center;
    padding:.55rem 0;
    gap:.75rem;
    border-bottom:1px solid #0f0f1a;
    font-size:.85rem;
    transition: background .15s;
  }
  .task-row:hover { background: rgba(255,255,255,.02); }
  .task-row:last-child { border-bottom:none; }

  .task-icon {
    font-size:1rem;
    width:24px;
    text-align:center;
    flex-shrink:0;
  }

  .task-info { flex:1; min-width:0; }
  .task-name { font-weight:500; }
  .task-why { font-size:.72rem; color:var(--muted); margin-top:2px; }

  .task-schedule {
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem;
    color:var(--muted);
    background:#0a0a14;
    padding:.15rem .5rem;
    border-radius:4px;
    flex-shrink:0;
    white-space:nowrap;
  }

  .task-status {
    flex-shrink:0;
    font-size:.75rem;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:.25rem;
  }
  .task-status.ok { color:var(--green); }
  .task-status.err { color:var(--red); }
  .task-status.pending { color:var(--yellow); }

  /* Pulse animation */
  @keyframes pulse-green {
    0%,100% { box-shadow:0 0 4px var(--green); }
    50% { box-shadow:0 0 16px var(--green); }
  }
  @keyframes pulse-red {
    0%,100% { box-shadow:0 0 4px var(--red); }
    50% { box-shadow:0 0 16px var(--red); }
  }
  .pulse-ok { animation:pulse-green 2s infinite; border-radius:50%; width:10px; height:10px; background:var(--green); display:inline-block; }
  .pulse-err { animation:pulse-red 2s infinite; border-radius:50%; width:10px; height:10px; background:var(--red); display:inline-block; }

  /* Summary bar */
  .summary-bar {
    max-width: 1400px;
    margin:.5rem auto 0;
    padding:0 2rem;
    display:flex;
    gap:2rem;
    font-size:.8rem;
    color:var(--muted);
    flex-wrap:wrap;
  }

  footer {
    text-align:center;
    padding:2rem;
    font-size:.7rem;
    color:var(--muted);
    border-top:1px solid var(--border);
    margin-top:2rem;
  }

  footer a { color:var(--blue); text-decoration:none; }

  /* Collapsed card */
  .agent-card.collapsed .task-list { display:none; }
  .agent-card.collapsed .agent-header { border-bottom:none; }

  @media (max-width:500px) {
    .main-grid { grid-template-columns:1fr; padding:.75rem; }
    header { padding:1rem; }
    .logo h1 { font-size:1.2rem; }
  }

  /* Responsive: show all agents in single column on small screens */
  @media (min-width:1200px) {
    .main-grid { grid-template-columns: repeat(3, 1fr); }
  }

  /* Empty agent note */
  .empty-note {
    text-align:center;
    padding:1.5rem;
    color:var(--muted);
    font-size:.8rem;
    font-style:italic;
  }

  /* Progress ring in header */
  .progress-ring {
    width:48px;
    height:48px;
    flex-shrink:0;
  }
</style>

// ── RENDER ──
function renderDashboard() {
  const container = document.getElementById('dashboard');
  let totalOk = 0, totalErr = 0, totalPend = 0, totalTasks = 0;

  container.innerHTML = AGENTS.map(agent => {
    const groupsHtml = agent.groups.map(g => {
      if (!g.tasks || g.tasks.length === 0) {
        return `<div class="task-group-title">${g.title}</div>
                <div class="empty-note">${g.empty || 'Sin tareas automáticas configuradas.'}</div>`;
      }

      const tasksHtml = g.tasks.map(t => {
        totalTasks++;
        let statusClass, icon;
        if (t.ok === true) { totalOk++; statusClass='ok'; icon='✅'; }
        else if (t.ok === false) { totalErr++; statusClass='err'; icon='❌'; }
        else { totalPend++; statusClass='pending'; icon='❓'; }

        const errNote = t.err ? `<br><span style="color:var(--red);font-size:.7rem">⚠️ ${t.err}</span>` : '';

        return `<div class="task-row">
          <span class="task-icon">${icon}</span>
          <div class="task-info">
            <div class="task-name">${t.name}</div>
            <div class="task-why">${t.why}${errNote}</div>
          </div>
          <span class="task-schedule">${t.schedule}</span>
        </div>`;
      }).join('');

      return `<div class="task-group-title">${g.title}</div>${tasksHtml}`;
    }).join('');

    const okCount = agent.groups.reduce((s,g) => s + (g.tasks||[]).filter(t=>t.ok===true).length, 0);
    const errCount = agent.groups.reduce((s,g) => s + (g.tasks||[]).filter(t=>t.ok===false).length, 0);

    return `<div class="agent-card">
      <div class="agent-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <div class="left">
          <span class="agent-emoji">${agent.emoji}</span>
          <div>
            <span class="agent-name">${agent.name}</span>
            <span class="agent-role">${agent.role}</span>
          </div>
        </div>
        <div class="agent-stats">
          ${okCount > 0 ? `<span class="badge ok">✅ ${okCount}</span>` : ''}
          ${errCount > 0 ? `<span class="badge err">❌ ${errCount}</span>` : ''}
          <span class="badge info">${(agent.groups.reduce((s,g)=>s+(g.tasks||[]).length,0))} total</span>
        </div>
      </div>
      <div class="task-list">${groupsHtml}</div>
    </div>`;
  }).join('');

  // Update counters
  document.getElementById('cnt-ok').textContent = totalOk;
  document.getElementById('cnt-err').textContent = totalErr;
  document.getElementById('cnt-pend').textContent = totalPend;
  document.getElementById('cnt-total').textContent = totalTasks;
}

// ── LOAD STATUS FROM VERIFICATION ──
async function loadStatus() {
  try {
    const resp = await fetch('status.json?t=' + Date.now());
    if (!resp.ok) throw new Error('no status file');
    const data = await resp.json();
    document.getElementById('last-verif').textContent = data.last_verification || '—';
    document.getElementById('gen-time').textContent = 'Verificado: ' + (data.last_verification || '—');
    if (data.next_refresh) {
      document.getElementById('next-refresh').textContent = data.next_refresh;
    }
    // Apply status overrides (future: override individual task status from verification)
  } catch(e) {
    document.getElementById('last-verif').textContent = 'No verificado aún';
    document.getElementById('gen-time').textContent = 'Generado: ' + new Date().toISOString().slice(0,16).replace('T',' ');
  }
}

renderDashboard();
loadStatus();
</script>
</body>
</html>

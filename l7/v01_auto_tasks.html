<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 BRAIN Auto-Tasks</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root { --bg:#0a0a0f; --card:#12121a; --border:#1e1e2e; --text:#e0e0e8; --muted:#6b6b80; --green:#00d68f; --green-bg:rgba(0,214,143,.12); --red:#ff4757; --red-bg:rgba(255,71,87,.12); --yellow:#ffa502; --yellow-bg:rgba(255,165,2,.12); --blue:#5b9bd5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5; }
  header { background:linear-gradient(135deg,#0f0f23,#1a1a3e 50%,#0f0f23); border-bottom:1px solid var(--border); padding:1rem 2rem; position:sticky; top:0; z-index:100; backdrop-filter:blur(20px); }
  .header-top { display:flex; align-items:center; justify-content:space-between; max-width:1200px; margin:0 auto; flex-wrap:wrap; gap:.75rem; }
  .logo { display:flex; align-items:center; gap:.6rem; } .logo span { font-size:1.8rem; } .logo h1 { font-size:1.3rem; font-weight:800; }
  .stats-row { display:flex; gap:.75rem; flex-wrap:wrap; }
  .stat-pill { display:flex; align-items:center; gap:.35rem; padding:.3rem .75rem; border-radius:2rem; font-size:.78rem; font-weight:600; background:var(--card); border:1px solid var(--border); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .legend-bar { max-width:1200px; margin:.5rem auto 0; padding:0 2rem; display:flex; gap:1.5rem; align-items:center; font-size:.7rem; color:var(--muted); flex-wrap:wrap; }
  .legend-sched { font-family:'JetBrains Mono',monospace; background:#0a0a14; padding:.1rem .4rem; border-radius:3px; font-size:.65rem; }

  .main { max-width:1200px; margin:1rem auto; padding:0 2rem; display:flex; flex-direction:column; gap:1rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .card.featured { border-color:var(--green); box-shadow:0 0 24px rgba(0,214,143,.08); }
  .card.warning { border-color:var(--red); }
  .card-header { padding:.9rem 1.25rem; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
  .card-header .l { display:flex; align-items:center; gap:.6rem; }
  .card-emoji { font-size:1.5rem; }
  .card-name { font-weight:700; font-size:1rem; }
  .card-role { font-size:.68rem; color:var(--muted); margin-left:.5rem; }
  .badge { padding:.15rem .5rem; border-radius:1rem; font-size:.68rem; font-weight:600; }
  .badge.ok { background:var(--green-bg); color:var(--green); }
  .badge.err { background:var(--red-bg); color:var(--red); }
  .badge.info { background:rgba(91,155,213,.12); color:var(--blue); }

  .card-body { padding:.25rem 1.25rem; }
  .section-title { font-size:.65rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); padding:.6rem 0 .3rem; border-bottom:1px solid #1a1a2a; margin-bottom:.3rem; }
  .row { display:flex; align-items:center; padding:.45rem 0; gap:.6rem; border-bottom:1px solid #0f0f1a; font-size:.8rem; }
  .row:hover { background:rgba(255,255,255,.01); }
  .row:last-child { border-bottom:none; }
  .row .ico { font-size:.9rem; width:20px; text-align:center; flex-shrink:0; }
  .row .info { flex:1; min-width:0; }
  .row .name { font-weight:500; }
  .row .why { font-size:.68rem; color:var(--muted); }
  .row .sched { font-family:'JetBrains Mono',monospace; font-size:.65rem; color:var(--muted); background:#0a0a14; padding:.1rem .4rem; border-radius:3px; flex-shrink:0; white-space:nowrap; }
  .row .st { flex-shrink:0; font-size:.7rem; font-weight:600; }
  .st.ok { color:var(--green); } .st.err { color:var(--red); } .st.warn { color:var(--yellow); }
  @keyframes pulse-g { 0%,100%{box-shadow:0 0 3px var(--green)} 50%{box-shadow:0 0 12px var(--green)} }
  @keyframes pulse-r { 0%,100%{box-shadow:0 0 3px var(--red)} 50%{box-shadow:0 0 12px var(--red)} }
  .p-ok { animation:pulse-g 2s infinite; width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; }
  .p-err { animation:pulse-r 2s infinite; width:8px; height:8px; border-radius:50%; background:var(--red); display:inline-block; }

  .collapsed .card-body { display:none; }
  .collapsed .card-header { border-bottom:none; }

  footer { text-align:center; padding:1.25rem; font-size:.65rem; color:var(--muted); border-top:1px solid var(--border); margin-top:1.5rem; }
  footer a { color:var(--blue); text-decoration:none; }

  @media (max-width:600px) { .main { padding:0 .75rem; } header { padding:.75rem; } }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="logo"><span>🧠</span><h1>BRAIN Auto-Tasks</h1></div>
    <div class="stats-row">
      <div class="stat-pill"><span class="dot" style="background:var(--green);box-shadow:0 0 8px var(--green)"></span> <span id="cok">—</span> OK</div>
      <div class="stat-pill"><span class="dot" style="background:var(--red);box-shadow:0 0 8px var(--red)"></span> <span id="cerr">—</span> Roto</div>
      <div class="stat-pill"><span class="dot" style="background:var(--muted)"></span> <span id="ctot">—</span> Total</div>
    </div>
  </div>
</header>
<div class="legend-bar">
  <strong>📅 Leyenda:</strong>
  <span><span class="legend-sched">*/30 * * * *</span> cada 30 min</span>
  <span><span class="legend-sched">0 8 * * *</span> 08:00 diario</span>
  <span><span class="legend-sched">cada 30m</span> intervalo daemon</span>
  <span style="margin-left:auto">🕐 Última verificación: <strong id="lv">—</strong></span>
</div>

<main class="main" id="dash"></main>

<footer>Panel por BRAIN 🧠 · <span id="gt">—</span> · <a href="https://github.com/DaniBrainClaw/brain-panels">GitHub</a></footer>

<script>
const TASKS = [
  // ═══ WATCHDOG ═══
  {card:"🛡️ System Watchdog", role:"Sync, permisos, procesos, RAM, disco. Si esto cae, todo cae.", featured:true, groups:[
    {title:"🛡️ Vigilancia unificada", rows:[
      {n:"system-watchdog-30m", w:"Bash puro. Verifica: daemon+watcher+feeder vivos, permisos agents/ 755, syncthing sin conflictos, disco, RAM, ChromaDB.", s:"cada 30m", ok:true},
      {n:"Health check 30m", w:"Disco, RAM, gateway, uptime vía cron del gateway.", s:"*/30 * * * *", ok:true},
      {n:"timeout-watchdog", w:"Detecta stalls de BRAIN >180s y alerta a Dani.", s:"cada 1m", ok:true},
    ]}
  ]},
  // ═══ BRAIN ═══
  {card:"🧠 BRAIN", role:"Heartbeats, auto-mejora, limpieza, daemon", groups:[
    {title:"🫀 Heartbeats & Mantenimiento", rows:[
      {n:"Heartbeat 30m", w:"Pulso cada 30min.", s:"*/30 * * * *", ok:true},
      {n:"Heartbeat 2h", w:"Auditoría gaps (REGLAS_BRAIN.md).", s:"0 */2 * * *", ok:true},
      {n:"End-of-day audit 22:30", w:"Audita el día, SCOREBOARD, CHANGELOG.", s:"30 22 * * *", ok:true},
      {n:"Nightly audit 01:00", w:"Auditoría completa del sistema.", s:"0 1 * * *", ok:true},
      {n:"Prune sessions 30m", w:"Limpia sesiones viejas.", s:"*/30 * * * *", ok:true},
      {n:"Memory capture", w:"Contexto sesión → memoria.", s:"59 0-1,9-23 * * *", ok:true},
      {n:"Memory symlink 00:05", w:"Symlink memoria diaria.", s:"5 0 * * *", ok:true},
      {n:"Nightly Learnings 01:00", w:"Errores → reglas anti-repetición.", s:"0 1 * * *", ok:false, err:"error"},
    ]},
    {title:"🤖 Daemon (9 activos / 11 rotos)", rows:[
      {n:"self-monitor", w:"Semáforo del sistema.", s:"30m", ok:true},
      {n:"detect-sessions", w:"Sesiones >500KB → archivar.", s:"60m", ok:true},
      {n:"check-health", w:"df + du sesiones.", s:"2h", ok:true},
      {n:"compact-sessions", w:"Compacta si >100K tokens.", s:"6h", ok:true},
      {n:"regen-inventory", w:"Regenera INVENTORY.md.", s:"6h", ok:true},
      {n:"archive-obsolete", w:"Scripts >60d → _obsolete/.", s:"7d", ok:true},
      {n:"self-introspect", w:"KNOWLEDGE_BASE.md.", s:"24h", ok:true},
      {n:"task-runner", w:"Ejecuta queue.jsonl.", s:"60m", ok:true},
      {n:"discover-ai / trends / use-cases / nvidia / competitive-scan / value-ideas / check-models / update-expert / daily-news / routing / explore-codebase", w:"11 scripts que existen pero nunca produjeron output. Stubs de junio 2026.", s:"varios", ok:false, err:"11 stubs sin output"},
    ]}
  ]},
  // ═══ DIRECTOR ═══
  {card:"📋 Director Organización", role:"Email, CRM, Trello, briefings", groups:[
    {title:"📧 Email & CRM", rows:[
      {n:"Email (4× día: 07:50, 12:00, 14:50, 19:00)", w:"Triaje: filtra, clasifica, prioriza.", s:"4× diario", ok:true},
      {n:"Check email pipeline 12:05", w:"Verifica fetch→parse→store.", s:"5 12 * * *", ok:true},
      {n:"Check CRM sync 07:55", w:"HubSpot→CRM local.", s:"55 7 * * *", ok:true},
      {n:"Sync CRM 23:00 + Mover tareas 23:00", w:"Sincronización nocturna + pipeline.", s:"0 23 * * *", ok:true},
      {n:"Check CRM move 08:00", w:"Movimiento entre pipelines.", s:"55 7 * * *", ok:false, err:"error"},
    ]},
    {title:"📊 Briefings & Checklists", rows:[
      {n:"Morning focus 07:45 + Briefing 08:45 + Cron audit 09:00", w:"Prioridades + briefing completo + auditoría.", s:"lu-vi", ok:true},
      {n:"Trello checklist 07:30 + verify 07:35", w:"Checklist diaria.", s:"30/35 7 * * 1-5", ok:false, err:"diaria error (2x)"},
      {n:"Cron audit 07:00 + 22:00", w:"Auditorías de crons.", s:"0 7/22 * * *", ok:false, err:"ambas error"},
      {n:"Collect 23:00 + Archive checklist 23:01", w:"Métricas + archivo.", s:"0/1 23 * * 1-5", ok:true},
      {n:"Sábado focus 10:00", w:"Revisión semanal.", s:"0 10 * * 6", ok:true},
    ]},
    {title:"📸 Snapshots", rows:[
      {n:"Panel snapshot hourly 08-19", w:"Foto horaria cola Dani → GitHub Pages.", s:"0 8-19 * * *", ok:true},
    ]}
  ]},
];

function render() {
  const d = document.getElementById('dash');
  let ok=0, err=0, tot=0;
  d.innerHTML = TASKS.map(c => {
    const groups = c.groups.map(g => {
      const rows = g.rows.map(r => {
        tot++; let cls,ico;
        if(r.ok===true){ok++;cls='ok';ico='✅';}
        else if(r.ok===false){err++;cls='err';ico='❌';}
        else{cls='warn';ico='❓';}
        const e = r.err?` <span style="color:var(--red);font-size:.65rem">— ${r.err}</span>`:'';
        return `<div class="row"><span class="ico">${ico}</span><div class="info"><div class="name">${r.n}${e}</div><div class="why">${r.w}</div></div><span class="sched">${r.s}</span></div>`;
      }).join('');
      return `<div class="section-title">${g.title}</div>${rows}`;
    }).join('');
    const oks=c.groups.reduce((s,g)=>s+g.rows.filter(r=>r.ok===true).length,0);
    const errs=c.groups.reduce((s,g)=>s+g.rows.filter(r=>r.ok===false).length,0);
    const cls = c.featured?'featured':(errs>0?'warning':'');
    return `<div class="card ${cls}"><div class="card-header" onclick="this.parentElement.classList.toggle('collapsed')"><div class="l"><span class="card-emoji">${c.card.split(' ')[0]}</span><span class="card-name">${c.card.split(' ').slice(1).join(' ')}</span><span class="card-role">${c.role}</span></div><span>${oks>0?`<span class="badge ok">✅${oks}</span> `:''}${errs>0?`<span class="badge err">❌${errs}</span> `:''}<span class="badge info">${c.groups.reduce((s,g)=>s+g.rows.length,0)}</span></span></div><div class="card-body">${groups}</div></div>`;
  }).join('');
  document.getElementById('cok').textContent=ok;
  document.getElementById('cerr').textContent=err;
  document.getElementById('ctot').textContent=tot;
}
render();
fetch('status.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('lv').textContent=d.last_verification||'—';
  document.getElementById('gt').textContent='Verificado: '+(d.last_verification||'—');
}).catch(()=>{
  document.getElementById('lv').textContent='pendiente (primera 03:00)';
  document.getElementById('gt').textContent='Generado: '+new Date().toISOString().slice(0,16).replace('T',' ');
});
</script>
</body>
</html>
